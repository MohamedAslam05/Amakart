<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Amakart</title>
</head>

<body bgcolor="bisque">

    <center>

        <div style="background-color:white; width:380px; padding:30px; margin-top:70px; border-radius:10px;">

            <h1 style="color:darkred;">Sign Up</h1>

            <form>

                <table cellpadding="10">

                    <tr>
                        <td>
                            <label><b>Name</b></label><br>
                            <input type="text" placeholder="Enter Name" style="width:260px; padding:10px; border-radius: 5px; border:1px solid #555">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label><b>Mobile Number</b></label><br>
                            <input type="tel" placeholder="Enter Mobile Number" style="width:260px; padding:10px; border-radius: 5px; border:1px solid #555">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label><b>Email</b></label><br>
                            <input type="email" placeholder="Enter Email" style="width:260px; padding:10px; border-radius: 5px; border:1px solid #555">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label><b>Password</b></label><br>
                            <input type="password" placeholder="Enter Password" style="width:260px; padding:10px; border-radius: 5px; border:1px solid #555">
                        </td>
                    </tr>

                    <tr>
                        <td align="center">
                            <button style="padding:10px 25px; background-color:darkred; color:white; border:none; cursor: pointer; border-radius: 5px;">
                                Submit
                            </button>
                        </td>
                    </tr>

                    <tr>
                        <td align="center">
                            Already have an account?
                            <a href="login.html">Login</a>
                        </td>
                    </tr>

                </table>

            </form>

        </div>

    </center>

</body>
</html>
