<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Amakart</title>
</head>

<body bgcolor="bisque">

    <center>

        <div style="background-color:white; width:350px; padding:30px; margin-top:100px; border-radius:10px;">

            <h1 style="color:darkred;">Login</h1>

            <form>

                <table cellpadding="10">

                    <tr>
                        <td>
                            <label><b>Username</b></label><br>
                            <input type="text" placeholder="Enter Username" style="width:250px; padding:10px; border:1px solid #555; border-radius: 5px">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label><b>Password</b></label><br>
                            <input type="password" placeholder="Enter Password" style="width:250px; padding:10px; border:1px solid #555; border-radius: 5px">
                        </td>
                    </tr>

                    <tr>
                        <td align="center">
                            <button style="padding:10px 20px; background-color:darkred; color:white; border:none; cursor: pointer; border-radius: 5px">
                                Login
                            </button>
                        </td>
                    </tr>

                    <tr>
                        <td align="center">
                        <a href="#">
                            Forgot Password?</a></td></tr>
                       <tr> <td align="center">
                            Don't have an account?
                            <a href="signup.html">Sign Up</a>
                        </td>
                    </tr>

                </table>

            </form>

        </div>

    </center>

</body>
</html>
